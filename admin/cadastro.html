<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Criar acesso | Loja do Preto</title>
  <link rel="icon" href="https://raw.githubusercontent.com/Sato190/loja-do-preto/main/assets/logo-clean.png">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="cadastro.css">
</head>
<body>
  <main class="signup-page">
    <section class="signup-card" id="signup-card">
      <a class="back-link" href="./">← Voltar para o login</a>
      <img src="https://raw.githubusercontent.com/Sato190/loja-do-preto/main/assets/logo-clean.png" alt="Loja do Preto">
      <p class="overline">Primeiro acesso</p>
      <h1>Crie agora<br>o seu login.</h1>
      <p>Cadastre seu e-mail e crie uma senha. Seu pedido será enviado diretamente ao administrador e ficará bloqueado até a aprovação.</p>
      <form id="signup-form">
        <label>E-mail<input required type="email" name="email" autocomplete="email" placeholder="seuemail@exemplo.com"></label>
        <label>Senha<div class="password-field"><input required id="signup-password" type="password" name="password" minlength="8" autocomplete="new-password" placeholder="Mínimo de 8 caracteres"><button class="password-toggle" type="button" data-toggle="signup-password" aria-label="Mostrar senha" title="Mostrar senha" hidden>👁️</button></div></label>
        <label>Confirme a senha<div class="password-field"><input required id="confirm-password" type="password" name="confirmPassword" minlength="8" autocomplete="new-password"><button class="password-toggle" type="button" data-toggle="confirm-password" aria-label="Mostrar senha" title="Mostrar senha" hidden>👁️</button></div></label>
        <button class="primary" type="submit">Criar meu acesso</button>
        <p class="status" role="status" aria-live="polite"></p>
      </form>
      <p class="login-hint">Já possui cadastro? <a href="./">Entrar no painel</a></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.1"></script>
  <script src="../supabase-config.js"></script>
  <script src="cadastro.js"></script>
</body>
</html>
